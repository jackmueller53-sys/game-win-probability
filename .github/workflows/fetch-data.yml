name: Fetch slate + stats

on:
  schedule:
    # Two refreshes per day: early morning (overnight stats) and ~2pm UTC
    # (catches posted starting lineups before evening east-coast games).
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Python deps
        run: pip install --quiet pybaseball pandas numpy pyarrow certifi
      - name: Fetch FanGraphs + MLB schedule
        run: node scripts/fetch-data.js
      - name: Build Statcast-derived stats + features
        run: python3 scripts/build_features.py
        continue-on-error: false  # build_features is now the primary data source
      - name: Check for changes
        id: check
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat
          fi
      - name: Commit + push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh slate — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      - name: Trigger deploy
        if: steps.check.outputs.changed == 'true'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run deploy.yml --ref main
